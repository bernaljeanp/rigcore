<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Solo root puede ser el servicio. -->
  <policy user="root">
    <allow own="io.github.vortice.Helper"/>
    <allow send_destination="io.github.vortice.Helper"/>
  </policy>

  <!-- Solo administradores. install.sh genera un bloque por cada grupo de
       administración que exista en la distro (wheel, sudo, admin). -->
  @ADMIN_POLICIES@

  <policy context="default">
    <deny send_destination="io.github.vortice.Helper"/>
  </policy>
</busconfig>
