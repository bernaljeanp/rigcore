[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rigcore"
version = "0.1.1"
description = "Centro de control para portátiles gaming en Linux: temperaturas, ventiladores, modos, batería, luces y perfiles por juego"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "bernaljeanp" }]
keywords = ["linux", "laptop", "gaming", "fan-control", "rgb", "alienware", "kde"]
classifiers = [
  "Environment :: X11 Applications :: Qt",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Hardware",
]
# La distro suele aportar PySide6 (python3-pyside6 / pyside6); con pip se instala esta.
# Con pip se usa PySide6 >= 6.12 (los shaders del repositorio se compilan con esa versión);
# los paquetes de distro recompilan los shaders con su propio Qt.
dependencies = ["PySide6-Essentials>=6.12"]

[project.urls]
Homepage = "https://github.com/bernaljeanp/rigcore"
Issues = "https://github.com/bernaljeanp/rigcore/issues"

[project.scripts]
rigcore = "rigcore.app:main"
rigcore-agent = "rigcore.agent:main"

[tool.setuptools]
# qml/, fonts/ y shaders/ son solo datos, pero setuptools quiere verlas declaradas.
packages = ["rigcore", "rigcore.qml", "rigcore.fonts", "rigcore.shaders"]

[tool.setuptools.package-data]
"rigcore.qml" = ["*"]
"rigcore.fonts" = ["*"]
"rigcore.shaders" = ["*"]
