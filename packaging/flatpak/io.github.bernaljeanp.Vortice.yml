# Flatpak de Vórtice (edición con sandbox).
# Sin perfiles por juego (el sandbox no ve los procesos del sistema) ni teclas
# globales; el servicio de hardware se instala aparte (install.sh o paquete).
app-id: io.github.bernaljeanp.Vortice
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
base: io.qt.PySide.BaseApp
base-version: '6.11'
command: vortice
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  # Gráfica (NVML) y controladores de luces USB (hidraw), como OpenRGB.
  - --device=all
  # Modos de rendimiento, servicio de hardware de Vórtice y perfil de tuned.
  - --system-talk-name=net.hadess.PowerProfiles
  - --system-talk-name=org.freedesktop.UPower.PowerProfiles
  - --system-talk-name=io.github.vortice.Helper
  - --system-talk-name=com.redhat.tuned
  # Icono en la bandeja (StatusNotifierItem).
  - --talk-name=org.kde.StatusNotifierWatcher
modules:
  - name: vortice
    buildsystem: simple
    build-commands:
      # Shaders compilados con el Qt del runtime.
      - QSB=$(command -v qsb || ls /usr/lib/*/qt6/bin/qsb /usr/lib/qt6/bin/qsb 2>/dev/null | head -1) sh tools/build_shaders.sh
      - pip3 install --no-deps --no-build-isolation --prefix=/app .
      - install -Dm644 packaging/flatpak/io.github.bernaljeanp.Vortice.desktop /app/share/applications/io.github.bernaljeanp.Vortice.desktop
      - install -Dm644 packaging/flatpak/io.github.bernaljeanp.Vortice.metainfo.xml /app/share/metainfo/io.github.bernaljeanp.Vortice.metainfo.xml
      - install -Dm644 vortice/qml/icon.svg /app/share/icons/hicolor/scalable/apps/io.github.bernaljeanp.Vortice.svg
    sources:
      - type: dir
        path: ../..
        skip: [.venv, build, .git, .flatpak-builder, packaging/flatpak/build-dir, packaging/flatpak/repo]
